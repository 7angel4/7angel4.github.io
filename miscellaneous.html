<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miscellaneous &mdash; Angel Y. He</title>
    <meta name="description" content="The fun facts page of Angel Y. He.">
    <link rel="icon" href="assets/resources/coffee.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/main.css">
    <script src="assets/scripts/elems.js" defer></script>
    <style>
        #miscellaneous {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 1.4rem;
            margin-top: 1rem;
        }

        .fun-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 1.3rem 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .fun-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .fun-card h2 {
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.9rem;
            color: var(--brown);
            margin-bottom: 0.2rem;
        }

        .fun-card p {
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
        }

        .fun-card img {
            width: 100%;
            max-width: 260px;
            height: 200px;
            object-fit: contain;
            margin-top: auto;
        }

        .image-caption {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }

    </style>
</head>
<body>
    <custom-nav></custom-nav>

    <main>
        <h1 class="page-title">Miscellaneous</h1>

        <section id="miscellaneous">
            <div class="fun-card">
                <h2>MBTI...</h2>
                <p>Looks like I'm an <a href="https://www.16personalities.com/istj-personality" target="_blank" rel="noopener">ISTJ</a>? 🤔</p>
                <img src="assets/resources/ISTJ-A.png" alt="ISTJ personality illustration"/>
                <figcaption class="image-caption">
                    Image credit: <a href="https://www.16personalities.com/" target="_blank" rel="noopener">16Personalities</a>
                </figcaption>
            </div>

            <div class="fun-card">
                <h2>Erdős number...</h2>
                <p>Mine is 4!</p>
                <img src="assets/resources/erdos.png" alt="Erdős number illustration"/>
                <figcaption class="image-caption">
                    Image credit: <a href="https://www.vismath.eu/en/films/n-number/" target="_blank" rel="noopener">VisMath</a>
                </figcaption>
            </div>

            <div class="fun-card">
                <h2>Taekwon-do...</h2>
                <p>..'ed for ~10 years</p>
                <img src="assets/resources/taekwon-do.png" alt="Taekwon-do"/>
            </div>

            <div class="fun-card">
                <h2>Coffee...</h2>
                <p>My love is visible from my website's colours</p>
                <img src="assets/resources/coffee.png" alt="Coffee"/>
            </div>

            <div class="fun-card">
                <h2>Brunch...</h2>
                <p>Meal with the highest prob. I'll accept an invitation for</p>
                <img src="assets/resources/brunch.png" alt="Brunch"/>
            </div>

            <div class="fun-card">
                <h2>Photography...</h2>
                <p>Very unprofessional</p>
                <img src="assets/resources/trinity-college-window.png" alt="Trinity College's window at Oxford"/>
            </div>
        </section>
    </main>

    <custom-footer></custom-footer>
</body>
</html>
